<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0052">
<meta name="robots" content="noindex">
<title>Sorteo · COTUCO</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/ui.css">
<style>
/* Proyección en sala.
 *
 * Esto se mira desde el fondo del Grand Salón, de pie y con una copa en
 * la mano. Todo está dimensionado en vw y vh y no en píxeles: la misma
 * página tiene que servir en un proyector de 1024 de ancho y en una
 * pantalla de 4K sin que nadie ajuste nada. Una sola cosa por vista,
 * enorme.
 *
 * Dos estados. Entre sorteos, la marca del patrocinador ocupa el centro;
 * al salir un ganador, el centro es suyo durante un rato y después la
 * pantalla vuelve sola a la marca. Nadie tiene que acordarse de hacerlo.
 */

html, body { height: 100%; overflow: hidden }
body {
  display: flex; flex-direction: column;
  background:
    radial-gradient(ellipse 70% 55% at 50% 0%, rgba(223,169,44,.16), transparent 70%),
    linear-gradient(170deg, var(--marino-alto) 0%, var(--marino) 45%, var(--tinta) 100%);
}

.cabecera {
  flex: 0 0 auto; display: flex; align-items: center;
  justify-content: space-between; padding: 2.2vh 3vw;
}
.cabecera img { height: 7vh; width: auto }
.conteo {
  text-align: right; font-size: 1.5vh; letter-spacing: .18em;
  text-transform: uppercase; color: var(--apagado); line-height: 1.7;
}
.conteo b { display: block; font-size: 3vh; color: var(--acento-alto); letter-spacing: 0 }

.centro {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 0 5vw; min-height: 0;
}

/* ================= Entre sorteos: la marca ================= */

.marca { display: flex; flex-direction: column; align-items: center }

.marca .credito {
  font-size: 1.7vh; font-weight: 700; letter-spacing: .32em;
  text-transform: uppercase; color: var(--acento); margin-bottom: 5vh;
}

.iso-caja {
  position: relative; width: 26vh; height: 26vh;
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 4.5vh;
}

/* El resplandor respira detrás del isotipo. Es lo que impide que la
   pantalla se lea como una imagen congelada cuando se mira de reojo
   desde el otro lado del salón. */
.iso-caja::before {
  content: ''; position: absolute; inset: -22%;
  background: radial-gradient(circle, rgba(121,181,76,.30) 0%,
                              rgba(121,181,76,.10) 42%, transparent 68%);
  animation: respira 5.5s ease-in-out infinite;
}
@keyframes respira {
  0%, 100% { opacity: .55; transform: scale(.93) }
  50%      { opacity: 1;   transform: scale(1.06) }
}

/* El isotipo gira. Tiene cinco aspas, así que una vuelta completa se lee
   como rehilete y no como una imagen dando tumbos. Lento a propósito:
   a esta escala, una vuelta rápida marea y distrae de la conversación,
   que es lo que la gente está haciendo entre sorteo y sorteo. */
.iso-caja img {
  position: relative; width: 100%; height: 100%; object-fit: contain;
  animation: gira 22s linear infinite;
}
@keyframes gira { to { transform: rotate(360deg) } }

/* El logotipo con un destello que lo recorre cada tantos segundos.
   El brillo se recorta con la silueta del propio PNG, así que viaja por
   las letras y no por una caja rectangular encima de ellas. */
.texto-caja { position: relative; display: inline-block }
.texto-caja img { height: 9vh; width: auto; display: block }
.texto-caja .destello {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(105deg,
    transparent 38%, rgba(246,238,163,.92) 50%, transparent 62%);
  background-size: 260% 100%;
  -webkit-mask-image: url('/img/quantum-texto.png');
          mask-image: url('/img/quantum-texto.png');
  -webkit-mask-size: contain; mask-size: contain;
  -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
  -webkit-mask-position: center; mask-position: center;
  animation: destella 6s ease-in-out infinite;
}
@keyframes destella {
  0%, 62%  { background-position: 190% 0 }
  88%, 100% { background-position: -90% 0 }
}

.marca .sitio {
  font-size: 1.8vh; letter-spacing: .22em; text-transform: uppercase;
  color: var(--apagado); margin-top: 4vh;
}

/* ================= Al salir un ganador ================= */

.rotulo {
  font-size: 2vh; font-weight: 700; letter-spacing: .3em;
  text-transform: uppercase; color: var(--acento); margin-bottom: 2.5vh;
}

.premio {
  font-size: 5.2vh; font-weight: 700; color: var(--texto);
  line-height: 1.15; margin-bottom: 2vh;
}

/* El patrocinador lleva su propio marco. Es quien puso el premio, y en
   un renglón de texto gris se pierde desde la tercera fila de mesas. */
.patrocinador {
  display: inline-flex; align-items: baseline; gap: .8em;
  border: 1px solid rgba(223,169,44,.45); border-radius: 999px;
  background: rgba(223,169,44,.10);
  padding: 1.1vh 2.4vh; margin-bottom: 5vh;
}
.patrocinador .et {
  font-size: 1.5vh; letter-spacing: .2em; text-transform: uppercase;
  color: var(--apagado);
}
.patrocinador .quien {
  font-size: 2.4vh; font-weight: 700; color: var(--acento-alto);
  letter-spacing: .02em;
}

.ganador {
  font-size: 11vh; font-weight: 900; line-height: 1.02;
  letter-spacing: -.03em;
  background: linear-gradient(180deg, var(--oro-alto) 0%, var(--oro) 65%, var(--oro-bajo) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--oro);
  margin-bottom: 2.5vh; word-break: break-word;
}
.organismo { font-size: 3.4vh; font-weight: 500; color: var(--tenue) }

/* La entrada del ganador. No es decoración: un nombre que aparece de
   golpe no se lee como un resultado, se lee como un error de la
   pantalla. El escalón de escala y el fundido dan el instante que la
   sala necesita para mirar hacia arriba. */
@keyframes entra {
  from { opacity: 0; transform: scale(.88) translateY(2vh) }
  to   { opacity: 1; transform: none }
}
.revela { animation: entra .55s cubic-bezier(.2,.9,.3,1.1) both }

/* El regreso a la marca es un fundido y no un corte: un cambio brusco
   en una pantalla grande llama la atención de toda la sala justo cuando
   ya no hay nada que anunciar. */
@keyframes aparece { from { opacity: 0 } to { opacity: 1 } }
.suave { animation: aparece 1.1s ease both }

.pie {
  flex: 0 0 auto; display: flex; align-items: center;
  justify-content: space-between; padding: 2vh 3vw;
  border-top: 1px solid var(--linea-suave);
  font-size: 1.5vh; color: var(--apagado); letter-spacing: .1em;
}
.pie img { height: 4vh; width: auto; opacity: .85; transition: opacity .6s }
/* Con la marca en el centro, la del pie sobra: dos veces el mismo
   logotipo en la misma pantalla se lee como un descuido. */
.pie img.oculta { opacity: 0 }

.aviso {
  position: fixed; left: 50%; bottom: 2vh; transform: translateX(-50%);
  background: rgba(255,138,122,.16); border: 1px solid var(--rojo);
  color: var(--rojo); padding: 10px 18px; border-radius: 999px;
  font-size: 1.6vh; opacity: 0; transition: opacity .3s;
}
.aviso.ver { opacity: 1 }

@media (prefers-reduced-motion: reduce) {
  .iso-caja img, .iso-caja::before, .texto-caja .destello,
  .revela, .suave { animation: none }
}
</style>
</head>
<body>

<div class="cabecera">
  <img src="/img/cotuco-blanco.png" alt="COTUCO">
  <div class="conteo">
    Participando
    <b id="p-elegibles">—</b>
  </div>
</div>

<div class="centro" id="p-centro"></div>

<div class="pie">
  <span id="p-evento">COTUCO</span>
  <img id="p-pie-logo" src="/img/quantum.png" alt="Quantum Marketing &amp; Advertising">
</div>

<div class="aviso" id="p-aviso"></div>

<script>
(function () {
  'use strict';

  /**
   * Cuánto se queda el ganador en pantalla antes de volver a la marca.
   *
   * Noventa segundos es lo que tarda alguien en levantarse de una mesa
   * del fondo, cruzar el salón y recoger su premio mientras la sala
   * aplaude. Si se quedara fijo, la pantalla pasaría la mayor parte de
   * la noche mostrando a un ganador de hace veinte minutos.
   *
   * Con la tecla G vuelve a mostrarse el último ganador, por si hace
   * falta recordarlo después de que la pantalla ya regresó.
   */
  var SEGUNDOS_GANADOR = 90;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
               '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var ultimoId = null;     // qué sorteo se está mostrando
  var ultimo = null;       // los datos del último ganador conocido
  var mostradoEn = 0;      // cuándo se puso en pantalla
  var enMarca = false;     // para no repintar la marca en cada consulta
  var fallos = 0;

  function avisar(texto) {
    var a = $('p-aviso');
    if (!texto) { a.classList.remove('ver'); return; }
    a.textContent = texto;
    a.classList.add('ver');
  }

  /* ---------------- Los dos estados ---------------- */

  function pintarMarca() {
    if (enMarca) return;
    enMarca = true;
    $('p-pie-logo').classList.add('oculta');
    $('p-centro').innerHTML =
      '<div class="marca suave">' +
        '<div class="credito">Registro, acceso y sorteo por</div>' +
        '<div class="iso-caja">' +
          '<img src="/img/quantum-isotipo.png" alt="">' +
        '</div>' +
        '<div class="texto-caja">' +
          '<img src="/img/quantum-texto.png" alt="Quantum Marketing &amp; Advertising">' +
          '<span class="destello"></span>' +
        '</div>' +
        '<div class="sitio">quantummkt.mx</div>' +
      '</div>';
  }

  function pintarGanador(u) {
    enMarca = false;
    $('p-pie-logo').classList.remove('oculta');
    $('p-centro').innerHTML =
      '<div class="revela">' +
        '<div class="rotulo">Ganador</div>' +
        '<div class="premio">' + esc(u.premio) + '</div>' +
        (u.patrocinador
          ? '<div class="patrocinador">' +
              '<span class="et">Cortesía de</span>' +
              '<span class="quien">' + esc(u.patrocinador) + '</span>' +
            '</div>'
          : '') +
        '<div class="ganador">' + esc(u.ganador) + '</div>' +
        '<div class="organismo">' + esc(u.organismo || '') + '</div>' +
      '</div>';
  }

  /* ---------------- Lo que llega del servidor ---------------- */

  fetch('/api/evento', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.evento) $('p-evento').textContent = d.evento; })
    .catch(function () {});

  function pintar(d) {
    $('p-elegibles').textContent = d.elegibles != null ? d.elegibles : '—';

    var u = d.ultimo;

    // Ganador nuevo: entra siempre, aunque la pantalla ya hubiera
    // vuelto a la marca.
    if (u && u.sorteo_id !== ultimoId) {
      ultimoId = u.sorteo_id;
      ultimo = u;
      mostradoEn = Date.now();
      pintarGanador(u);
      return;
    }

    // Mismo ganador: se queda su rato y después la pantalla vuelve sola.
    if (!enMarca && mostradoEn &&
        Date.now() - mostradoEn > SEGUNDOS_GANADOR * 1000) {
      pintarMarca();
      return;
    }

    // Todavía no se ha sorteado nada en toda la noche.
    if (!u && !ultimo) pintarMarca();
  }

  function consultar() {
    fetch('/api/sorteo/estado', { credentials: 'same-origin' })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) throw new Error('sesion');
        return r.json();
      })
      .then(function (d) { fallos = 0; avisar(''); pintar(d); })
      .catch(function (e) {
        if (e && e.message === 'sesion') {
          avisar('Sin sesión: abre /tablero en esta máquina y entra.');
          return;
        }
        // Un parpadeo de red no debe poner un letrero rojo en la
        // proyección. Sólo después de varios fallos seguidos se avisa,
        // porque entonces sí hay algo que atender.
        if (++fallos >= 4) avisar('Sin conexión con el servidor');
      });
  }

  pintarMarca();
  consultar();
  setInterval(consultar, 2000);

  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    // F: pantalla completa. El proyector se conecta y nadie quiere
    // buscar el menú del navegador frente a la sala.
    if (k === 'f') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(function () {});
    }
    // G: traer de vuelta al último ganador.
    if (k === 'g' && ultimo) {
      mostradoEn = Date.now();
      pintarGanador(ultimo);
    }
    // M: volver a la marca sin esperar.
    if (k === 'm') pintarMarca();
  });
})();
</script>
</body>
</html>
