<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0052">
<meta name="robots" content="noindex">
<title>Sorteo · COTUCO</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/ui.css">
<style>
/* Proyección en sala.
 *
 * Esto se mira desde el fondo del Grand Salón, de pie y con una copa en
 * la mano. Todo está dimensionado en vw y vh y no en píxeles: la misma
 * página tiene que servir en un proyector de 1024 de ancho y en una
 * pantalla de 4K sin que nadie ajuste nada. Una sola cosa por vista,
 * enorme.
 *
 * Dos estados. Entre sorteos, la marca del patrocinador ocupa el centro;
 * al salir un ganador, el centro es suyo durante un rato y después la
 * pantalla vuelve sola a la marca. Nadie tiene que acordarse de hacerlo.
 */

html, body { height: 100%; overflow: hidden }
body {
  display: flex; flex-direction: column;
  background:
    radial-gradient(ellipse 70% 55% at 50% 0%, rgba(223,169,44,.16), transparent 70%),
    linear-gradient(170deg, var(--marino-alto) 0%, var(--marino) 45%, var(--tinta) 100%);
}

.cabecera {
  flex: 0 0 auto; display: flex; align-items: center;
  justify-content: space-between; padding: 2.2vh 3vw;
}
.cabecera img { height: 7vh; width: auto }
.conteo {
  text-align: right; font-size: 1.5vh; letter-spacing: .18em;
  text-transform: uppercase; color: var(--apagado); line-height: 1.7;
}
.conteo b { display: block; font-size: 3vh; color: var(--acento-alto); letter-spacing: 0 }

.centro {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  text-align: center; padding: 0 5vw; min-height: 0;
}

/* ================= Entre sorteos: la marca ================= */

/* Dos diapositivas en el mismo lugar: la marca del patrocinador y la
   del evento. Se superponen y se cruzan en fundido en vez de empujarse,
   porque un corte en una pantalla de este tamaño llama la atención de
   toda la sala cada quince segundos, que es justo lo contrario de lo
   que debe hacer algo que corre de fondo.

   El contenedor toma el alto completo para que las dos queden centradas
   en el mismo punto: si cada una se midiera sola, al cambiar saltarían
   unos píxeles y el fundido se leería como un parpadeo. */
.marca { position: relative; width: 100%; height: 100% }
.diapo {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  opacity: 0; transform: scale(.985);
  transition: opacity 1.2s ease, transform 1.2s ease;
  pointer-events: none;
}
.diapo.ver { opacity: 1; transform: none }

/* La diapositiva del evento */
.diapo-evento .marca-evento { width: min(46vw, 82vh) }
.diapo-evento .marca-evento img { width: 100%; height: auto; display: block }
.diapo-evento .lema {
  font-size: 2.6vh; color: var(--tenue); margin-top: 4vh;
  letter-spacing: .04em;
}

.marca .credito {
  font-size: 1.7vh; font-weight: 700; letter-spacing: .32em;
  text-transform: uppercase; color: var(--acento); margin-bottom: 6vh;
}

/* El logotipo en su versión horizontal, tal como está construida la
   marca: el isotipo a la izquierda y el logotipo a su derecha.
 *
 * Las proporciones salen del archivo original, no se ajustaron a ojo.
 * Ahí el isotipo mide 106 de ancho, el aire que lo separa mide 16 y el
 * logotipo 344, sobre 120 de alto. Como el isotipo se recortó en un
 * lienzo cuadrado de 120 —necesita serlo para girar sobre su centro y
 * no bambolearse— lleva 7 de relleno a cada lado, y el aire se reduce a
 * 9 para que la separación que se ve en pantalla siga siendo la misma
 * que en el logotipo original. El total queda en 473 y de ahí salen los
 * tres porcentajes.
 */
.marca .lockup {
  display: flex; align-items: center;
  /* 20 % menos que el tamaño original (54vw / 96vh). */
  width: min(43.2vw, 76.8vh);
}
.marca .lockup .iso { width: 25.37%; aspect-ratio: 1 / 1 }
.marca .lockup .sep { width: 1.90% }
.marca .lockup .txt { width: 72.73% }
.marca .lockup img { width: 100%; height: auto; display: block }

/* Sólo gira el isotipo. Tiene cinco aspas y es simétrico, así que una
   vuelta se lee como rehilete y no como una imagen dando tumbos. Lento
   a propósito: a tamaño de proyector, una vuelta rápida marea y compite
   con la conversación, que es lo que la gente está haciendo entre un
   sorteo y el siguiente. */
.marca .lockup .iso img { animation: gira 22s linear infinite }
@keyframes gira { to { transform: rotate(360deg) } }

.marca .sitio {
  font-size: 1.8vh; letter-spacing: .22em; text-transform: uppercase;
  color: var(--apagado); margin-top: 6vh;
}

/* ================= Al salir un ganador ================= */

.rotulo {
  font-size: 2vh; font-weight: 700; letter-spacing: .3em;
  text-transform: uppercase; color: var(--acento); margin-bottom: 2.5vh;
}

.premio {
  font-size: 5.2vh; font-weight: 700; color: var(--texto);
  line-height: 1.15; margin-bottom: 2vh;
}

/* El patrocinador lleva su propio marco. Es quien puso el premio, y en
   un renglón de texto gris se pierde desde la tercera fila de mesas. */
.patrocinador {
  display: inline-flex; align-items: baseline; gap: .8em;
  border: 1px solid rgba(223,169,44,.45); border-radius: 999px;
  background: rgba(223,169,44,.10);
  padding: 1.1vh 2.4vh; margin-bottom: 5vh;
}
.patrocinador .et {
  font-size: 1.5vh; letter-spacing: .2em; text-transform: uppercase;
  color: var(--apagado);
}
.patrocinador .quien {
  font-size: 2.4vh; font-weight: 700; color: var(--acento-alto);
  letter-spacing: .02em;
}

.ganador {
  font-size: 11vh; font-weight: 900; line-height: 1.02;
  letter-spacing: -.03em;
  background: linear-gradient(180deg, var(--oro-alto) 0%, var(--oro) 65%, var(--oro-bajo) 100%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: var(--oro);
  margin-bottom: 2.5vh; word-break: break-word;
}
.organismo { font-size: 3.4vh; font-weight: 500; color: var(--tenue) }

/* ================= La tómbola =================
 *
 * Cinco segundos de nombres pasando antes del ganador. Pasan nombres de
 * invitados reales, cada vez más lento, y una barra marca cuánto falta:
 * la sala necesita ver que «está girando» para mirar hacia arriba antes
 * de que salga el nombre. */
.girando { opacity: .92; min-height: 11vh }
.barra-t {
  width: min(40vw, 70vh); height: .7vh; margin: 4vh auto 0;
  background: var(--linea-suave); border-radius: 999px; overflow: hidden;
}
.barra-t i {
  display: block; height: 100%; width: 0;
  background: linear-gradient(90deg, var(--oro-bajo), var(--oro-alto));
  animation: llena var(--dur-tombola, 5s) linear forwards;
}
@keyframes llena { to { width: 100% } }

/* El confeti va en un lienzo encima de todo y no recibe clics. */
#p-confeti {
  position: fixed; inset: 0; width: 100%; height: 100%;
  pointer-events: none; z-index: 50;
}

/* La entrada del ganador. No es decoración: un nombre que aparece de
   golpe no se lee como un resultado, se lee como un error de la
   pantalla. El escalón de escala y el fundido dan el instante que la
   sala necesita para mirar hacia arriba. */
@keyframes entra {
  from { opacity: 0; transform: scale(.88) translateY(2vh) }
  to   { opacity: 1; transform: none }
}
.revela { animation: entra .55s cubic-bezier(.2,.9,.3,1.1) both }

/* El regreso a la marca es un fundido y no un corte: un cambio brusco
   en una pantalla grande llama la atención de toda la sala justo cuando
   ya no hay nada que anunciar. */
@keyframes aparece { from { opacity: 0 } to { opacity: 1 } }
.suave { animation: aparece 1.1s ease both }

.pie {
  flex: 0 0 auto; display: flex; align-items: center;
  justify-content: space-between; padding: 2vh 3vw;
  border-top: 1px solid var(--linea-suave);
  font-size: 1.5vh; color: var(--apagado); letter-spacing: .1em;
}
.pie img { height: 4vh; width: auto; opacity: .85; transition: opacity .6s }
/* Con la marca en el centro, la del pie sobra: dos veces el mismo
   logotipo en la misma pantalla se lee como un descuido. */
.pie img.oculta { opacity: 0 }

.aviso {
  position: fixed; left: 50%; bottom: 2vh; transform: translateX(-50%);
  background: rgba(255,138,122,.16); border: 1px solid var(--rojo);
  color: var(--rojo); padding: 10px 18px; border-radius: 999px;
  font-size: 1.6vh; opacity: 0; transition: opacity .3s;
}
.aviso.ver { opacity: 1 }

@media (prefers-reduced-motion: reduce) {
  .marca .lockup .iso img, .revela, .suave { animation: none }
}
</style>
</head>
<body>

<div class="cabecera">
  <img src="/img/cotuco-blanco.png" alt="COTUCO">
  <div class="conteo">
    Participando
    <b id="p-elegibles">—</b>
  </div>
</div>

<div class="centro" id="p-centro"></div>

<div class="pie">
  <span id="p-evento">COTUCO</span>
  <img id="p-pie-logo" src="/img/quantum.png" alt="Quantum Marketing &amp; Advertising">
</div>

<div class="aviso" id="p-aviso"></div>
<canvas id="p-confeti"></canvas>

<script>
(function () {
  'use strict';

  /**
   * Cuánto se queda el ganador en pantalla antes de volver a la marca.
   *
   * Noventa segundos es lo que tarda alguien en levantarse de una mesa
   * del fondo, cruzar el salón y recoger su premio mientras la sala
   * aplaude. Si se quedara fijo, la pantalla pasaría la mayor parte de
   * la noche mostrando a un ganador de hace veinte minutos.
   *
   * Con la tecla G vuelve a mostrarse el último ganador, por si hace
   * falta recordarlo después de que la pantalla ya regresó.
   */
  var SEGUNDOS_GANADOR = 90;

  /** Cada cuánto se cambia entre la marca del patrocinador y la del evento. */
  var SEGUNDOS_DIAPO = 15;

  /** Cuánto gira la tómbola antes de revelar al ganador. */
  var SEGUNDOS_TOMBOLA = 5;

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;',
               '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var ultimoId = null;     // qué sorteo se está mostrando
  var ultimo = null;       // los datos del último ganador conocido
  var mostradoEn = 0;      // cuándo se puso en pantalla
  var enMarca = false;     // para no repintar la marca en cada consulta
  var fallos = 0;
  var lemaEvento = 'Un destino para congresos y convenciones';
  var primeraConsulta = true;  // al abrir la página no se gira: sólo se muestra
  var nombresTombola = [];     // invitados que pasan durante la tómbola
  var relojTombola = null;

  function avisar(texto) {
    var a = $('p-aviso');
    if (!texto) { a.classList.remove('ver'); return; }
    a.textContent = texto;
    a.classList.add('ver');
  }

  /* ---------------- Los dos estados ---------------- */

  /**
   * Entre sorteos se alternan dos diapositivas: el patrocinador y el
   * evento. Las dos se dibujan una sola vez y después sólo se cambia
   * cuál está visible —el fundido lo hace el CSS—, en vez de rehacer el
   * HTML cada quince segundos: si se reconstruyera, el isotipo
   * reiniciaría su giro en cada cambio y se vería un tirón.
   */
  var diapoActual = 0;
  var relojDiapos = null;

  function alternar() {
    var d = document.querySelectorAll('#p-centro .diapo');
    if (d.length < 2) return;
    diapoActual = (diapoActual + 1) % d.length;
    for (var i = 0; i < d.length; i++) {
      d[i].classList.toggle('ver', i === diapoActual);
    }
  }

  function pararDiapos() {
    if (relojDiapos) { clearInterval(relojDiapos); relojDiapos = null; }
  }

  function pintarMarca() {
    pararTombola();
    if (enMarca) return;
    enMarca = true;
    diapoActual = 0;
    $('p-pie-logo').classList.add('oculta');
    $('p-centro').innerHTML =
      '<div class="marca suave">' +
        '<div class="diapo ver">' +
          '<div class="credito">Registro, acceso y sorteo por</div>' +
          '<div class="lockup">' +
            '<span class="iso"><img src="/img/quantum-isotipo.png" alt=""></span>' +
            '<span class="sep"></span>' +
            '<span class="txt"><img src="/img/quantum-texto.png" ' +
              'alt="Quantum Marketing &amp; Advertising"></span>' +
          '</div>' +
          '<div class="sitio">quantummkt.mx</div>' +
        '</div>' +
        '<div class="diapo diapo-evento">' +
          '<div class="marca-evento">' +
            '<img src="/img/tijuana.png" alt="Tijuana">' +
          '</div>' +
          '<div class="lema">' + esc(lemaEvento) + '</div>' +
        '</div>' +
      '</div>';

    pararDiapos();
    relojDiapos = setInterval(alternar, SEGUNDOS_DIAPO * 1000);
  }

  function pintarGanador(u) {
    enMarca = false;
    pararDiapos();
    $('p-pie-logo').classList.remove('oculta');
    $('p-centro').innerHTML =
      '<div class="revela">' +
        '<div class="rotulo">Ganador</div>' +
        '<div class="premio">' + esc(u.premio) + '</div>' +
        (u.patrocinador
          ? '<div class="patrocinador">' +
              '<span class="et">Cortesía de</span>' +
              '<span class="quien">' + esc(u.patrocinador) + '</span>' +
            '</div>'
          : '') +
        '<div class="ganador">' + esc(u.ganador) + '</div>' +
        '<div class="organismo">' + esc(u.organismo || '') + '</div>' +
      '</div>';
  }

  /* ---------------- La tómbola ---------------- */

  /**
   * Los nombres que pasan son de invitados (los proveedores no participan
   * en la rifa, así que tampoco aparecen girando). Si ya llegaron
   * suficientes, se usan sólo los presentes. Se refresca cada minuto
   * para ir sumando a quien va entrando.
   */
  function cargarNombres() {
    fetch('/api/asistentes?filtro=generales', { credentials: 'same-origin' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) {
        if (!d || !d.asistentes) return;
        var todos = d.asistentes.filter(function (a) { return a.nombre; });
        var llegaron = todos.filter(function (a) { return a.llego_en; });
        var base = llegaron.length >= 8 ? llegaron : todos;
        nombresTombola = base.map(function (a) { return a.nombre; });
      })
      .catch(function () {});
  }

  function pararTombola() {
    if (relojTombola) { clearTimeout(relojTombola); relojTombola = null; }
  }

  function codigoAlAzar() {
    var abc = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', s = '';
    for (var i = 0; i < 6; i++) s += abc.charAt(Math.floor(Math.random() * abc.length));
    return s;
  }

  function tombola(u) {
    enMarca = false;
    pararDiapos();
    pararTombola();
    $('p-pie-logo').classList.remove('oculta');
    $('p-centro').innerHTML =
      '<div class="revela" style="--dur-tombola:' + SEGUNDOS_TOMBOLA + 's">' +
        '<div class="rotulo">Sorteando</div>' +
        '<div class="premio">' + esc(u.premio) + '</div>' +
        (u.patrocinador
          ? '<div class="patrocinador">' +
              '<span class="et">Cortesía de</span>' +
              '<span class="quien">' + esc(u.patrocinador) + '</span>' +
            '</div>'
          : '') +
        '<div class="ganador girando" id="p-gira">&nbsp;</div>' +
        '<div class="barra-t"><i></i></div>' +
      '</div>';

    var lista = nombresTombola.slice();
    var i = lista.length ? Math.floor(Math.random() * lista.length) : 0;
    var inicio = Date.now();
    var dur = SEGUNDOS_TOMBOLA * 1000;

    function paso() {
      var t = Date.now() - inicio;
      if (t >= dur) {
        relojTombola = null;
        mostradoEn = Date.now();
        pintarGanador(u);
        confeti();
        return;
      }
      var el = $('p-gira');
      if (el) {
        if (lista.length) {
          i = (i + 1 + Math.floor(Math.random() * 3)) % lista.length;
          el.textContent = lista[i];
        } else {
          el.textContent = codigoAlAzar();
        }
      }
      // Empieza rápido y va frenando, como una tómbola de verdad.
      var f = t / dur;
      relojTombola = setTimeout(paso, 60 + Math.round(340 * f * f));
    }
    paso();
  }

  cargarNombres();
  setInterval(cargarNombres, 60000);

  /* ---------------- Confeti dorado ---------------- */

  /**
   * Una ráfaga desde las dos esquinas de abajo, en los tonos del oro del
   * logotipo, que cae girando y se apaga sola en unos cuatro segundos.
   * Se dibuja en un lienzo propio, sin librerías: la página no carga
   * scripts de fuera.
   */
  var COLORES_CONFETI = ['#DFA92C', '#F6EEA3', '#FFD873', '#C8901E', '#FFF6D5'];
  var reducirMovimiento = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function confeti() {
    if (reducirMovimiento) return;
    var cv = $('p-confeti');
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d');
    var dpr = window.devicePixelRatio || 1;
    var W = cv.clientWidth, H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var escala = Math.max(0.6, Math.min(W, H) / 900);
    var piezas = [];
    function lanzar(x, dir, n) {
      for (var i = 0; i < n; i++) {
        var ang = (-Math.PI / 2) + dir * (0.15 + Math.random() * 0.55);
        var vel = (14 + Math.random() * 12) * escala;
        piezas.push({
          x: x, y: H + 10,
          vx: Math.cos(ang) * vel, vy: Math.sin(ang) * vel,
          w: (7 + Math.random() * 8) * escala,
          h: (4 + Math.random() * 6) * escala,
          rot: Math.random() * Math.PI * 2,
          vr: (Math.random() - 0.5) * 0.35,
          bam: Math.random() * Math.PI * 2,
          color: COLORES_CONFETI[Math.floor(Math.random() * COLORES_CONFETI.length)],
          circulo: Math.random() < 0.18
        });
      }
    }
    lanzar(W * 0.04, 1, 110);
    lanzar(W * 0.96, -1, 110);

    var inicio = performance.now();
    var DURA = 4200;

    function cuadro(ahora) {
      var t = ahora - inicio;
      ctx.clearRect(0, 0, W, H);
      var alfa = t > DURA - 900 ? Math.max(0, (DURA - t) / 900) : 1;
      ctx.globalAlpha = alfa;
      for (var i = 0; i < piezas.length; i++) {
        var p = piezas[i];
        p.vy += 0.38 * escala;      // gravedad
        p.vx *= 0.985; p.vy *= 0.985;
        p.bam += 0.12;
        p.x += p.vx + Math.sin(p.bam) * 0.8;
        p.y += p.vy;
        p.rot += p.vr;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        if (p.circulo) {
          ctx.beginPath(); ctx.arc(0, 0, p.h * 0.6, 0, Math.PI * 2); ctx.fill();
        } else {
          // El coseno aplana el papelito al girar, como si diera vueltas.
          ctx.fillRect(-p.w / 2, -p.h / 2 * Math.abs(Math.cos(p.bam)),
                       p.w, p.h * Math.abs(Math.cos(p.bam)) + 0.5);
        }
        ctx.restore();
      }
      if (t < DURA) requestAnimationFrame(cuadro);
      else ctx.clearRect(0, 0, W, H);
    }
    requestAnimationFrame(cuadro);
  }

  /* ---------------- Lo que llega del servidor ---------------- */

  fetch('/api/evento', { credentials: 'same-origin' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d) return;
      if (d.evento) $('p-evento').textContent = d.evento;
      if (d.lema) {
        lemaEvento = d.lema;
        var l = document.querySelector('.diapo-evento .lema');
        if (l) l.textContent = d.lema;
      }
    })
    .catch(function () {});

  function pintar(d) {
    $('p-elegibles').textContent = d.elegibles != null ? d.elegibles : '—';

    var u = d.ultimo;

    // Ganador nuevo: entra siempre, aunque la pantalla ya hubiera
    // vuelto a la marca.
    if (u && u.sorteo_id !== ultimoId) {
      ultimoId = u.sorteo_id;
      ultimo = u;
      mostradoEn = Date.now();
      // Si la página se acaba de abrir (o se recargó), el ganador que ya
      // estaba se muestra directo: girar de nuevo por alguien que ya se
      // anunció confundiría a la sala.
      if (primeraConsulta) pintarGanador(u);
      else tombola(u);
      primeraConsulta = false;
      return;
    }
    primeraConsulta = false;

    // Mismo ganador: se queda su rato y después la pantalla vuelve sola.
    if (!enMarca && mostradoEn &&
        Date.now() - mostradoEn > SEGUNDOS_GANADOR * 1000) {
      pintarMarca();
      return;
    }

    // Todavía no se ha sorteado nada en toda la noche.
    if (!u && !ultimo) pintarMarca();
  }

  function consultar() {
    fetch('/api/sorteo/estado', { credentials: 'same-origin' })
      .then(function (r) {
        if (r.status === 401 || r.status === 403) throw new Error('sesion');
        return r.json();
      })
      .then(function (d) { fallos = 0; avisar(''); pintar(d); })
      .catch(function (e) {
        if (e && e.message === 'sesion') {
          avisar('Sin sesión: abre /tablero en esta máquina y entra.');
          return;
        }
        // Un parpadeo de red no debe poner un letrero rojo en la
        // proyección. Sólo después de varios fallos seguidos se avisa,
        // porque entonces sí hay algo que atender.
        if (++fallos >= 4) avisar('Sin conexión con el servidor');
      });
  }

  pintarMarca();
  consultar();
  setInterval(consultar, 2000);

  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    // F: pantalla completa. El proyector se conecta y nadie quiere
    // buscar el menú del navegador frente a la sala.
    if (k === 'f') {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(function () {});
    }
    // G: traer de vuelta al último ganador.
    if (k === 'g' && ultimo) {
      pararTombola();
      mostradoEn = Date.now();
      pintarGanador(ultimo);
    }
    // M: volver a la marca sin esperar.
    if (k === 'm') pintarMarca();
  });
})();
</script>
</body>
</html>
