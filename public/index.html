<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0D0052">
<title>Registro · COTUCO</title>
<meta name="description" content="Registro de asistentes. Comité de Turismo y Convenciones de Tijuana.">
<link rel="icon" href="/img/cotuco-blanco.png">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/ui.css">
<style>
/* ---------- Encabezado ----------
   Reproduce el orden de la invitación: COTUCO arriba, los dos aliados,
   la línea de invitación, el logotipo TIJUANA y los datos. Quien abre el
   enlace acaba de ver esa imagen en su WhatsApp. */

.cabecera { text-align: center; padding: 30px 0 20px }
.cabecera .escudo {
  width: min(250px, 66vw); height: auto; display: block; margin: 0 auto 20px;
}

.aliados {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; margin-bottom: 24px; flex-wrap: wrap;
}
.aliados img { height: 26px; width: auto; display: block; opacity: .9 }
.aliados .fidem { height: 24px }

.invita {
  font-size: 11.5px; font-weight: 800; letter-spacing: .2em;
  text-transform: uppercase; color: var(--tenue); line-height: 1.7;
}

/* El logotipo del evento es una imagen y no texto: su degradado dorado y
   las siluetas recortadas dentro de las letras no se reproducen con CSS,
   y es lo que hace reconocible la pieza. */
.logotipo { width: min(420px, 88vw); height: auto; display: block; margin: 12px auto 6px }

.bajada {
  font-size: clamp(14px, 4vw, 17px); font-weight: 700; line-height: 1.3;
  letter-spacing: .01em; color: var(--texto);
}

.filete {
  width: 64px; height: 2px; margin: 20px auto;
  background: linear-gradient(90deg, transparent, var(--oro), transparent);
}

.cuando {
  font-size: clamp(16px, 4.6vw, 20px); font-weight: 900;
  color: var(--oro-alto); line-height: 1.4; letter-spacing: .02em;
}
.donde { font-size: 13.5px; color: var(--tenue); margin-top: 6px; line-height: 1.5 }

/* ---------- Pase ---------- */

.pase {
  text-align: center;
  border: 1px solid rgba(223,169,44,.45);
  border-radius: var(--r-grande);
  padding: 22px 18px;
  background: linear-gradient(170deg, rgba(223,169,44,.13), rgba(255,255,255,.03));
}
.pase .quien {
  font-size: 21px; font-weight: 900; line-height: 1.18;
  margin: 8px 0 2px; letter-spacing: -.015em;
}
.pase .donde-trabaja { font-size: 13.5px; color: var(--tenue); line-height: 1.4 }
.pase .tipo { margin-top: 10px }

/* Marco blanco alrededor del QR: un código oscuro sobre fondo azul no se
   lee, y en la puerta eso es una fila detenida. */
.qr-marco {
  background: #fff; border-radius: 14px; padding: 12px;
  display: inline-block; margin: 18px 0 12px;
  box-shadow: 0 6px 22px rgba(0,0,0,.3);
}
.qr-marco img { width: min(240px, 62vw); height: auto; display: block }

.codigo {
  font-size: 27px; font-weight: 900; letter-spacing: .2em;
  font-variant-numeric: tabular-nums; color: var(--oro-alto);
}
.codigo-k {
  font-size: 9.5px; font-weight: 800; letter-spacing: .16em;
  text-transform: uppercase; color: var(--apagado); margin-top: 3px;
}

.acciones-pase { display: grid; gap: 9px; margin-top: 18px }
.aviso-guarda {
  font-size: 12.5px; color: var(--apagado); text-align: center;
  margin-top: 16px; line-height: 1.6;
}

.pie-enlace { text-align: center; margin-top: 18px; font-size: 13px }
.pie-enlace a { color: var(--oro-alto); font-weight: 700 }

.cerrado {
  text-align: center; padding: 30px 20px;
}
</style>
</head>
<body>

<div class="marco">

  <div class="cabecera">
    <img class="escudo" src="/img/cotuco-blanco.png"
         alt="Comité de Turismo y Convenciones de Tijuana">

    <div class="aliados">
      <img src="/img/cdt.png" alt="Consejo de Desarrollo de Tijuana">
      <img class="fidem" src="/img/fidem.png"
           alt="Fideicomiso Empresarial del Estado de Baja California">
    </div>

    <div class="invita">Te invita a:<br>Cóctel presentación</div>

    <img class="logotipo" src="/img/tijuana.png" alt="Tijuana">

    <h1 class="bajada" id="h-evento">&nbsp;</h1>

    <div class="filete"></div>

    <div class="cuando" id="h-cuando"></div>
    <div class="donde" id="h-donde"></div>
  </div>

  <!-- ===== Formulario ===== -->
  <div id="formulario">
    <div class="tarjeta">
      <h2>Regístrate</h2>
      <p class="ay" style="margin:4px 0 20px">
        Llena tus datos y recibe tu código QR. Preséntalo en la entrada.
      </p>

      <div class="campo">
        <label for="f-nombre">Nombre completo</label>
        <input id="f-nombre" type="text" autocomplete="name"
               autocapitalize="words" enterkeyhint="next"
               placeholder="Nombre y apellidos">
        <div class="error-txt" id="e-nombre"></div>
      </div>

      <div class="campo">
        <label for="f-cargo">Cargo <span class="opc">— opcional</span></label>
        <input id="f-cargo" type="text" autocapitalize="sentences"
               enterkeyhint="next" placeholder="Director de operaciones">
        <div class="error-txt" id="e-cargo"></div>
      </div>

      <div class="campo">
        <label for="f-organismo">Organismo o empresa</label>
        <input id="f-organismo" type="text" autocomplete="organization"
               autocapitalize="words" enterkeyhint="next">
        <div class="error-txt" id="e-organismo"></div>
      </div>

      <div class="campo">
        <label for="f-telefono">Teléfono</label>
        <input id="f-telefono" type="tel" autocomplete="tel"
               inputmode="numeric" enterkeyhint="next"
               placeholder="664 123 4567">
        <div class="error-txt" id="e-telefono"></div>
      </div>

      <div class="campo">
        <label for="f-email">Correo</label>
        <input id="f-email" type="email" autocomplete="email"
               autocapitalize="off" spellcheck="false" enterkeyhint="done"
               placeholder="correo@empresa.mx">
        <div class="error-txt" id="e-email"></div>
      </div>

      <div class="campo" id="campo-tipo">
        <label>¿Cómo asistes?</label>
        <div class="opciones">
          <label class="opcion" data-tipo="general">
            <input type="radio" name="tipo" value="general">
            <!-- El nombre formal es «Invitado (Organismos Colegiados,
                 Asociados e Instituciones)». Partido en título y
                 subtítulo dice lo mismo y se lee de un golpe en el
                 celular; en un solo renglón con paréntesis se parte en
                 tres líneas y el paréntesis queda huérfano. -->
            <span>
              <span class="t">Invitado</span>
              <span class="d">Organismos Colegiados, Asociados e Instituciones</span>
            </span>
          </label>
          <label class="opcion" data-tipo="proveedor">
            <input type="radio" name="tipo" value="proveedor">
            <span>
              <span class="t">Cadena de valor · Proveedor</span>
              <span class="d">Ofreces productos o servicios al sector.</span>
            </span>
          </label>
        </div>
        <div class="error-txt" id="e-tipo"></div>
      </div>

      <div class="mensaje mal" id="f-error"></div>

      <button class="boton" id="f-enviar" style="margin-top:8px">
        Obtener mi pase
      </button>
    </div>

    <div class="pie-enlace">
      ¿Ya te registraste? <a href="#" id="ver-mi-pase">Ver mi pase</a>
    </div>
  </div>

  <!-- ===== Pase ===== -->
  <div id="resultado" hidden></div>

  <!-- ===== Registros cerrados ===== -->
  <div id="cerrado" hidden>
    <div class="tarjeta cerrado">
      <h2>Los registros están cerrados</h2>
      <p class="ay" style="margin-top:8px">
        Si ya tienes tu pase, puedes recuperarlo con tu correo.
      </p>
      <button class="boton fantasma" id="c-mi-pase" style="margin-top:16px">
        Ver mi pase
      </button>
    </div>
  </div>

  <div class="marca">
    <span>Powered by</span>
    <img src="/img/quantum.png" alt="Quantum Marketing &amp; Advertising">
  </div>

</div>

<script src="/lib/qrcode.min.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var CAMPOS = ['nombre', 'cargo', 'organismo', 'telefono', 'email'];
  // La forma corta, que es la que cabe en una pastilla. La larga viene
  // del servidor en `tipo_texto` por si alguna vez hace falta.
  var TIPO_TEXTO = {
    general: 'Invitado',
    proveedor: 'Cadena de valor · Proveedor',
  };

  var EVENTO = { evento: '', lema: '', sede: '', direccion: '',
                 fecha: '', hora: '' };

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  /* ---------- Datos del evento ---------- */

  var MESES = ['enero','febrero','marzo','abril','mayo','junio','julio',
               'agosto','septiembre','octubre','noviembre','diciembre'];
  var DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

  /**
   * Arma la fecha en palabras.
   *
   * Se construye con `new Date(a, m-1, d)` y no con `new Date('2026-11-20')`:
   * esa forma se interpreta como UTC y en Tijuana muestra el día anterior.
   */
  function fechaLarga(iso) {
    var p = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!p) return '';
    var d = new Date(+p[1], +p[2] - 1, +p[3]);
    return DIAS[d.getDay()] + ' ' + (+p[3]) + ' de ' + MESES[+p[2] - 1];
  }

  function horaLarga(hm) {
    var p = String(hm || '').match(/^(\d{1,2}):(\d{2})$/);
    if (!p) return '';
    var h = +p[1];
    var ampm = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12 || 12;
    return h12 + ':' + p[2] + ' ' + ampm;
  }

  /** «miércoles 21 de octubre · 7:00 PM», o lo que haya de los dos. */
  function cuandoTexto() {
    return [fechaLarga(EVENTO.fecha), horaLarga(EVENTO.hora)]
      .filter(Boolean).join(' · ');
  }

  function mayuscula(s) {
    return s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
  }

  function pintarEvento(e) {
    EVENTO = e;
    // Bajo el logotipo va el lema, que es corto. El nombre completo se
    // queda para el título de la pestaña, el calendario y el pase.
    $('h-evento').textContent = e.lema || e.evento || 'Registro de asistentes';
    document.title = (e.evento || 'Registro') + ' · COTUCO';

    $('h-cuando').textContent = mayuscula(cuandoTexto());
    $('h-donde').textContent = [e.sede, e.direccion].filter(Boolean).join(' · ');

    if (!e.abierto) {
      $('formulario').hidden = true;
      $('cerrado').hidden = false;
    }
  }

  /* ---------- Tipo de asistente ---------- */

  document.querySelectorAll('.opcion').forEach(function (op) {
    op.addEventListener('click', function () {
      document.querySelectorAll('.opcion').forEach(function (o) {
        o.classList.remove('on');
      });
      op.classList.add('on');
      $('campo-tipo').classList.remove('malo');
      $('e-tipo').classList.remove('ver');
    });
  });

  function tipoElegido() {
    var r = document.querySelector('input[name="tipo"]:checked');
    return r ? r.value : '';
  }

  /* ---------- Enviar ---------- */

  function limpiarErrores() {
    CAMPOS.forEach(function (c) {
      var campo = $('f-' + c);
      if (campo) campo.parentElement.classList.remove('malo');
      var e = $('e-' + c);
      if (e) { e.textContent = ''; e.classList.remove('ver'); }
    });
    $('campo-tipo').classList.remove('malo');
    $('e-tipo').classList.remove('ver');
    $('f-error').classList.remove('ver');
  }

  function enviar() {
    limpiarErrores();

    var b = $('f-enviar');
    b.disabled = true;
    b.textContent = 'Generando tu pase…';

    var cuerpo = { tipo: tipoElegido() };
    CAMPOS.forEach(function (c) { cuerpo[c] = $('f-' + c).value; });

    fetch('/api/registro', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(cuerpo),
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; })
          .then(function (d) {
            if (!r.ok) { d.__estado = r.status; throw d; }
            return d;
          });
      })
      .then(function (d) { mostrarPase(d.asistente, d.yaEstaba); })
      .catch(function (d) {
        b.disabled = false;
        b.textContent = 'Obtener mi pase';

        if (d && d.errores) {
          Object.keys(d.errores).forEach(function (c) {
            if (c === 'tipo') {
              $('campo-tipo').classList.add('malo');
            } else {
              var campo = $('f-' + c);
              if (campo) campo.parentElement.classList.add('malo');
            }
            var e = $('e-' + c);
            if (e) { e.textContent = d.errores[c]; e.classList.add('ver'); }
          });
          // Si el error no corresponde a ningún campo visible se muestra
          // arriba: si no, la persona no ve nada y cree que no pasó nada.
          var sueltos = Object.keys(d.errores).filter(function (c) {
            return !$('e-' + c);
          });
          if (sueltos.length) {
            $('f-error').textContent = sueltos.map(function (c) {
              return d.errores[c];
            }).join(' · ');
            $('f-error').classList.add('ver');
          } else {
            var primero = document.querySelector('.campo.malo');
            if (primero) primero.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }
          return;
        }

        $('f-error').textContent = (d && d.error) ||
          'No se pudo registrar. Revisa tu conexión e inténtalo otra vez.';
        $('f-error').classList.add('ver');
      });
  }

  /* ---------- El pase ---------- */

  function mostrarPase(a, yaEstaba) {
    $('formulario').hidden = true;
    $('cerrado').hidden = true;
    $('resultado').hidden = false;

    var conFecha = !!EVENTO.fecha;

    $('resultado').innerHTML =
      '<div class="tarjeta">' +
        (yaEstaba
          ? '<div class="mensaje aviso ver" style="margin-top:0;margin-bottom:18px">' +
            'Ya estabas registrado. Este es tu pase.</div>'
          : '<div class="mensaje bien ver" style="margin-top:0;margin-bottom:18px">' +
            '¡Listo! Tu lugar está registrado.</div>') +

        '<div class="pase">' +
          '<div class="rotulo">Pase de acceso</div>' +
          '<div class="quien">' + esc(a.nombre) + '</div>' +
          '<div class="donde-trabaja">' +
            esc([a.cargo, a.organismo].filter(Boolean).join(' · ')) +
          '</div>' +
          '<div class="tipo"><span class="chip oro">' +
            esc(TIPO_TEXTO[a.tipo] || '') + '</span></div>' +
          '<div class="qr-marco"><img id="qr" alt="Tu código de acceso"></div>' +
          '<div class="codigo">' + esc(a.codigo) + '</div>' +
          '<div class="codigo-k">Tu código</div>' +
        '</div>' +

        '<div class="acciones-pase">' +
          '<button class="boton" id="b-guardar">Guardar mi pase</button>' +
          (conFecha
            ? '<button class="boton fantasma" id="b-calendario">' +
              'Agregar a mi calendario</button>' : '') +
        '</div>' +

        '<p class="aviso-guarda">' +
          'Toma una captura por si te quedas sin señal.<br>' +
          'También puedes volver a este enlace y entrar con tu correo.' +
        '</p>' +
      '</div>';

    dibujarQR(a.codigo);

    $('b-guardar').addEventListener('click', function () { guardar(a); });
    if (conFecha) {
      $('b-calendario').addEventListener('click', agregarCalendario);
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function dibujarQR(codigo) {
    if (!window.QRCode) return;
    QRCode.toDataURL(codigo, {
      width: 600, margin: 1, errorCorrectionLevel: 'M',
      color: { dark: '#0D0052', light: '#ffffff' },
    }, function (err, url) {
      if (!err) { var img = $('qr'); if (img) img.src = url; }
    });
  }

  /* ---------- La imagen del pase ---------- */

  /**
   * Rectángulo de esquinas redondas.
   *
   * `roundRect` es de 2023 y no existe en Safari anterior a 16.4. Entre
   * cientos de asistentes va a haber teléfonos de varios años, y sin esto
   * el marco del QR fallaría justo en los equipos más viejos.
   */
  function rectaRedonda(g, x, y, an, al, r) {
    if (g.roundRect) { g.beginPath(); g.roundRect(x, y, an, al, r); return; }
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + an - r, y);
    g.quadraticCurveTo(x + an, y, x + an, y + r);
    g.lineTo(x + an, y + al - r);
    g.quadraticCurveTo(x + an, y + al, x + an - r, y + al);
    g.lineTo(x + r, y + al);
    g.quadraticCurveTo(x, y + al, x, y + al - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  /** Centra un texto achicándolo hasta que quepa, en vez de desbordarlo. */
  function textoAjustado(g, texto, y, W, tam, peso, color, minimo) {
    var t = tam;
    g.font = peso + ' ' + t + 'px Montserrat, Arial, sans-serif';
    while (g.measureText(texto).width > W - 90 && t > minimo) {
      t -= 1.5;
      g.font = peso + ' ' + t + 'px Montserrat, Arial, sans-serif';
    }
    g.fillStyle = color;
    g.fillText(texto, W / 2, y);
  }

  /** Dibuja una imagen centrada con el alto que se le pida. */
  function centrada(g, img, W, y, alto) {
    if (!img || !img.complete || !img.naturalWidth) return 0;
    var an = img.naturalWidth * alto / img.naturalHeight;
    g.drawImage(img, (W - an) / 2, y, an, alto);
    return alto;
  }

  /**
   * Dibuja el pase en un lienzo.
   *
   * Es la invitación convertida en pase: el mismo azul, el mismo oro, el
   * mismo logotipo. Quien lo recibe por WhatsApp reconoce de inmediato de
   * qué evento es sin abrir nada más.
   */
  function pintarPase(a, listo) {
    QRCode.toDataURL(a.codigo, {
      width: 700, margin: 1, errorCorrectionLevel: 'M',
      color: { dark: '#0D0052', light: '#ffffff' },
    }, function (err, url) {
      if (err) { listo(null); return; }

      var im = new Image();
      im.onload = function () {
        /*
         * Dos lienzos, no uno.
         *
         * El alto del pase depende de lo que traiga cada persona: con
         * cargo o sin él, con pastilla de tipo o sin ella. Con una altura
         * fija, a unos les sobraba medio palmo de azul vacío antes del
         * pie. Aquí el contenido se dibuja primero sobre un lienzo
         * transparente de sobra, se mide dónde terminó, y recién entonces
         * se arma el definitivo con el fondo y el marco a la medida.
         */
        var W = 760;
        var borrador = document.createElement('canvas');
        borrador.width = W; borrador.height = 1500;
        var g = borrador.getContext('2d');

        var oro = g.createLinearGradient(0, 0, W, 0);
        oro.addColorStop(0, '#9A6F14');
        oro.addColorStop(.5, '#F6EEA3');
        oro.addColorStop(1, '#9A6F14');

        g.textAlign = 'center';
        var y = 58;

        y += centrada(g, escudo, W, y, 66) ? 66 + 26 : 20;

        var linea = function (texto, tam, peso, color, salto) {
          g.font = peso + ' ' + tam + 'px Montserrat, Arial, sans-serif';
          g.fillStyle = color;
          g.fillText(texto, W / 2, y);
          y += salto;
        };

        linea('TE INVITA A: CÓCTEL PRESENTACIÓN', 12.5, '800',
              'rgba(255,255,255,.72)', 30);

        // El logotipo del evento va como imagen: su degradado y las
        // siluetas dentro de las letras no se dibujan con fuentes.
        y += centrada(g, logotipo, W, y, 108) ? 108 + 18 : 0;

        if (EVENTO.lema) {
          textoAjustado(g, EVENTO.lema.toUpperCase(), y, W, 16, '800',
                        '#FFFFFF', 11);
          y += 40;
        }

        // Filete de oro: separa la cabecera del pase propiamente dicho.
        g.fillStyle = oro;
        g.fillRect(W / 2 - 42, y - 14, 84, 2);
        y += 24;

        linea('PASE DE ACCESO', 11.5, '800', '#DFA92C', 42);

        textoAjustado(g, a.nombre, y, W, 32, '900', '#FFFFFF', 18);
        y += 34;

        var sub = [a.cargo, a.organismo].filter(Boolean).join(' · ');
        if (sub) {
          textoAjustado(g, sub, y, W, 17, '600', 'rgba(255,255,255,.72)', 12);
          y += 30;
        }

        // El tipo de asistente en una pastilla: en la puerta se ve de un
        // golpe si quien llega es proveedor o invitado general.
        var etq = (TIPO_TEXTO[a.tipo] || '').toUpperCase();
        if (etq) {
          g.font = '800 13px Montserrat, Arial, sans-serif';
          var an = g.measureText(etq).width + 36;
          g.fillStyle = 'rgba(223,169,44,.22)';
          rectaRedonda(g, (W - an) / 2, y - 4, an, 32, 16);
          g.fill();
          g.strokeStyle = '#DFA92C';
          g.lineWidth = 1.4;
          rectaRedonda(g, (W - an) / 2, y - 4, an, 32, 16);
          g.stroke();
          g.fillStyle = '#F6EEA3';
          g.fillText(etq, W / 2, y + 17);
          y += 56;
        } else {
          y += 14;
        }

        // Marco blanco: un QR azul sobre fondo azul no se lee, y en la
        // puerta eso es una fila detenida.
        var lado = 400, x = (W - lado) / 2;
        g.fillStyle = '#ffffff';
        rectaRedonda(g, x - 20, y - 20, lado + 40, lado + 40, 20);
        g.fill();
        g.drawImage(im, x, y, lado, lado);
        y += lado + 70;

        // El espaciado entre letras no existe en canvas: se dibuja letra
        // por letra para que el código se lea igual que en pantalla.
        g.font = '900 34px Montserrat, Arial, sans-serif';
        g.fillStyle = '#F6EEA3';
        var sep = 11, ancho = 0, i;
        for (i = 0; i < a.codigo.length; i++) {
          ancho += g.measureText(a.codigo[i]).width + (i ? sep : 0);
        }
        var cx = (W - ancho) / 2;
        g.textAlign = 'left';
        for (i = 0; i < a.codigo.length; i++) {
          g.fillText(a.codigo[i], cx, y);
          cx += g.measureText(a.codigo[i]).width + sep;
        }
        g.textAlign = 'center';
        y += 52;

        var cuando = cuandoTexto();
        if (cuando) {
          textoAjustado(g, mayuscula(cuando), y, W, 18, '800', '#DFA92C', 12);
          y += 28;
        }
        var donde = [EVENTO.sede, EVENTO.direccion].filter(Boolean).join(' · ');
        if (donde) {
          textoAjustado(g, donde, y, W, 14.5, '500',
                        'rgba(255,255,255,.62)', 10);
          y += 24;
        }

        // Pie de Quantum. A tamaño completo y sin atenuar: el pase es
        // lo que la gente reenvía por WhatsApp, y Quantum patrocina el
        // evento. Un logo al 78 % en la pieza más compartida es la peor
        // esquina donde ahorrar.
        y += 22;
        if (quantum && quantum.complete && quantum.naturalWidth) {
          y += centrada(g, quantum, W, y, 34) ? 34 : 0;
        }

        /* ---- El lienzo definitivo, ya con la altura medida ---- */

        var H = Math.round(y + 44);
        var c = document.createElement('canvas');
        c.width = W; c.height = H;
        var gf = c.getContext('2d');

        // El azul de la invitación: abierto arriba, cerrado abajo.
        var grad = gf.createLinearGradient(0, 0, 0, H);
        grad.addColorStop(0, '#17007A');
        grad.addColorStop(.45, '#0D0052');
        grad.addColorStop(1, '#06002A');
        gf.fillStyle = grad;
        gf.fillRect(0, 0, W, H);

        // Marco de oro, como el de la pieza impresa. Es lo que convierte
        // una captura suelta en algo que parece emitido por COTUCO.
        var oroF = gf.createLinearGradient(0, 0, W, 0);
        oroF.addColorStop(0, '#9A6F14');
        oroF.addColorStop(.5, '#F6EEA3');
        oroF.addColorStop(1, '#9A6F14');
        gf.strokeStyle = oroF;
        gf.lineWidth = 3;
        rectaRedonda(gf, 16, 16, W - 32, H - 32, 22);
        gf.stroke();

        gf.drawImage(borrador, 0, 0);

        listo(c);
      };
      im.onerror = function () { listo(null); };
      im.src = url;
    });
  }

  /**
   * Guarda el pase como imagen.
   *
   * El atributo `download` NO guarda en la galería del iPhone: manda el
   * archivo a Archivos, donde la gente no lo encuentra, o simplemente no
   * hace nada. Por eso se usa el menú de compartir del sistema, que sí
   * ofrece «Guardar en Fotos» y además deja reenviarlo por WhatsApp sin
   * salir de la pantalla. En computadora se descarga, que es lo normal.
   */
  function guardar(a) {
    var b = $('b-guardar');
    b.disabled = true;
    b.textContent = 'Generando…';

    var restaurar = function () {
      b.disabled = false;
      b.textContent = 'Guardar mi pase';
    };

    pintarPase(a, function (lienzo) {
      if (!lienzo) { restaurar(); return; }
      var nombre = nombreArchivo(a.nombre);

      aArchivo(lienzo, nombre, function (archivo) {
        var puede = archivo && navigator.canShare &&
                    navigator.canShare({ files: [archivo] });

        if (navigator.share && puede) {
          navigator.share({
            files: [archivo],
            title: 'Pase de acceso · COTUCO',
            text: 'Tu pase de acceso. Preséntalo en la entrada.',
          }).then(restaurar).catch(function (e) {
            // Si la persona cancela el menú no es un error: se deja como
            // estaba. Si falló de verdad, se intenta descargar.
            if (e && e.name === 'AbortError') { restaurar(); return; }
            bajar(lienzo, nombre);
            restaurar();
          });
          return;
        }

        bajar(lienzo, nombre);
        restaurar();
      });
    });
  }

  function nombreArchivo(nombre) {
    return 'pase-cotuco-' + String(nombre).toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.png';
  }

  function aArchivo(lienzo, nombre, listo) {
    if (!lienzo.toBlob || typeof File === 'undefined') { listo(null); return; }
    lienzo.toBlob(function (blob) {
      try { listo(new File([blob], nombre, { type: 'image/png' })); }
      catch (e) { listo(null); }
    }, 'image/png');
  }

  function bajar(lienzo, nombre) {
    var soltar = function (href, revocar) {
      var liga = document.createElement('a');
      liga.href = href;
      liga.download = nombre;
      document.body.appendChild(liga);
      liga.click();
      document.body.removeChild(liga);
      if (revocar) setTimeout(function () { URL.revokeObjectURL(href); }, 1500);
    };
    if (lienzo.toBlob) {
      lienzo.toBlob(function (b) { soltar(URL.createObjectURL(b), true); },
                    'image/png');
    } else {
      soltar(lienzo.toDataURL('image/png'), false);
    }
  }

  /* ---------- Calendario ----------
   *
   * Un archivo .ics lo entienden todos los calendarios: iPhone, Android,
   * Outlook y Google. Una liga a Google Calendar sólo serviría a los que
   * usan Google.
   */

  /**
   * Parte los renglones largos como manda el formato.
   *
   * El .ics no admite renglones de más de 75 octetos: lo que sobra se
   * continúa en el siguiente empezando con un espacio. Casi todos los
   * calendarios perdonan un renglón largo, pero Outlook no siempre, y el
   * nombre de este evento con la sede completa se pasa de sobra.
   *
   * Se cuenta en bytes y no en caracteres porque los acentos ocupan dos,
   * y se corta en el límite de un carácter para no partir una ñ a la
   * mitad y dejar basura.
   */
  function plegar(linea) {
    var bytes = function (s) { return new TextEncoder().encode(s).length; };
    if (!window.TextEncoder || bytes(linea) <= 75) return linea;

    var salida = [];
    var resto = linea;
    var tope = 74;                    // la primera lleva 75; las demás, un espacio delante
    while (bytes(resto) > tope) {
      var corte = tope;
      while (corte > 1 && bytes(resto.slice(0, corte)) > tope) corte--;
      salida.push(resto.slice(0, corte));
      resto = resto.slice(corte);
      tope = 73;
    }
    salida.push(resto);
    return salida[0] + salida.slice(1).map(function (t) {
      return '\r\n ' + t;
    }).join('');
  }

  function agregarCalendario() {
    var p = String(EVENTO.fecha).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!p) return;
    var hm = String(EVENTO.hora || '09:00').match(/^(\d{1,2}):(\d{2})$/) ||
             [null, '9', '00'];

    // Tijuana es UTC−7 en horario de verano y UTC−8 en invierno. En vez
    // de adivinar el desfase se usa la forma con zona horaria explícita,
    // que es la que resuelve bien el propio calendario.
    var dos = function (n) { return String(n).padStart(2, '0'); };
    var inicio = p[1] + p[2] + p[3] + 'T' + dos(+hm[1]) + hm[2] + '00';
    var fin = new Date(+p[1], +p[2] - 1, +p[3], +hm[1] + 4, +hm[2]);
    var finTxt = fin.getFullYear() + dos(fin.getMonth() + 1) + dos(fin.getDate()) +
                 'T' + dos(fin.getHours()) + dos(fin.getMinutes()) + '00';

    var escIcs = function (s) {
      return String(s || '').replace(/[\\,;]/g, function (m) { return '\\' + m; });
    };

    var ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//COTUCO//Registro de asistentes//ES',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:cotuco-' + p[1] + p[2] + p[3] + '@cotuco.mx',
      'DTSTAMP:' + sello(new Date()),
      'DTSTART;TZID=America/Tijuana:' + inicio,
      'DTEND;TZID=America/Tijuana:' + finTxt,
      'SUMMARY:' + escIcs(EVENTO.evento || 'Evento COTUCO'),
      'LOCATION:' + escIcs([EVENTO.sede, EVENTO.direccion]
        .filter(Boolean).join(', ')),
      'DESCRIPTION:Presenta tu código QR en la entrada.',
      'BEGIN:VALARM',
      'TRIGGER:-P1D',                      // aviso el día anterior
      'ACTION:DISPLAY',
      'DESCRIPTION:' + escIcs('Mañana: ' + (EVENTO.evento || 'evento COTUCO')),
      'END:VALARM',
      'END:VEVENT',
      'END:VCALENDAR',
    ].map(plegar).join('\r\n');

    var blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
    var liga = document.createElement('a');
    liga.href = URL.createObjectURL(blob);
    liga.download = 'evento-cotuco.ics';
    liga.click();
    setTimeout(function () { URL.revokeObjectURL(liga.href); }, 1000);
  }

  function sello(d) {
    var p = function (n) { return String(n).padStart(2, '0'); };
    return d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) +
           'T' + p(d.getUTCHours()) + p(d.getUTCMinutes()) +
           p(d.getUTCSeconds()) + 'Z';
  }

  /* ---------- Recuperar el pase ---------- */

  function recuperar(ev) {
    if (ev) ev.preventDefault();
    var email = prompt('Escribe el correo con el que te registraste:');
    if (!email) return;

    fetch('/api/mi-pase?email=' + encodeURIComponent(email))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || !d.asistente) {
          alert('No encontramos un registro con ese correo.\n\n' +
                'Revisa que esté bien escrito, o llena el formulario.');
          return;
        }
        mostrarPase(d.asistente, true);
      })
      .catch(function () { alert('No se pudo consultar. Revisa tu conexión.'); });
  }

  $('ver-mi-pase').addEventListener('click', recuperar);
  $('c-mi-pase').addEventListener('click', recuperar);

  /* ---------- Arranque ---------- */

  // Las imágenes se cargan al abrir, no al guardar: si se cargaran en ese
  // momento, el pase saldría sin ellas la primera vez.
  var escudo = new Image();
  escudo.src = '/img/cotuco-blanco.png';
  var logotipo = new Image();
  logotipo.src = '/img/tijuana.png';
  var quantum = new Image();
  quantum.src = '/img/quantum.png';   // la versión clara, para el azul

  $('f-enviar').addEventListener('click', enviar);

  // Enter avanza al siguiente campo; en el último, envía.
  CAMPOS.forEach(function (c, i) {
    var campo = $('f-' + c);
    if (!campo) return;
    campo.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      var sig = $('f-' + CAMPOS[i + 1]);
      if (sig) sig.focus(); else enviar();
    });
  });

  fetch('/api/evento')
    .then(function (r) { return r.json(); })
    .then(pintarEvento)
    .catch(function () { $('h-evento').textContent = 'Registro de asistentes'; });

  // Si el enlace trae un código, se muestra ese pase directamente.
  var cod = new URLSearchParams(location.search).get('c');
  if (cod) {
    fetch('/api/pase/' + encodeURIComponent(cod))
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && d.asistente) mostrarPase(d.asistente, true); })
      .catch(function () {});
  }
})();
</script>
